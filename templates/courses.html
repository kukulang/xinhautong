{% extends "base.html" %}
{% block page_title %}课程管理{% endblock %}
{% block content %}
<div class="card-box">
    <div class="toolbar">
        <div class="ms-auto"><button class="btn btn-primary" onclick="openAdd()"><i class="bi bi-plus-lg"></i> 新增课程</button></div>
    </div>
    <div class="row g-3" id="courseList"></div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增课程</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-6"><label class="form-label">课程名称*</label><input id="i-name" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">等级</label>
        <select id="i-level" class="form-select"><option>启蒙级</option><option>初级</option><option>中级</option><option>高级</option><option>金牌级</option></select></div>
      <div class="col-md-3"><label class="form-label">适合年龄</label>
        <select id="i-age_range" class="form-select"><option>4-6岁</option><option>5-7岁</option><option>7-9岁</option><option>9-12岁</option><option>12岁以上</option></select></div>
      <div class="col-md-3"><label class="form-label">总课时</label><input id="i-total_lessons" type="number" class="form-control" value="24"></div>
      <div class="col-md-3"><label class="form-label">价格(元)</label><input id="i-price" type="number" class="form-control" value="3000"></div>
      <div class="col-md-3"><label class="form-label">状态</label>
        <select id="i-status" class="form-select"><option>在售</option><option>停售</option></select></div>
      <div class="col-12"><label class="form-label">课程简介</label><textarea id="i-description" class="form-control" rows="4"></textarea></div>
    </div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
      <button class="btn btn-primary" onclick="save()">保存</button></div>
  </div></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
let editing = null;
const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal'));

async function loadList() {
    const res = await api.get('/api/courses');
    document.getElementById('courseList').innerHTML = res.data.map(c => `
        <div class="col-md-4">
          <div class="card-box h-100" style="margin-bottom:0">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="mb-1">${escapeHtml(c.name)}</h5>
                <div class="mb-2">
                  <span class="tag tag-pink">${c.level}</span>
                  <span class="tag tag-blue">${c.age_range}</span>
                  ${statusTag(c.status)}
                </div>
              </div>
              <div class="text-end">
                <div class="text-danger" style="font-size:20px;font-weight:bold">¥${c.price}</div>
                <small class="text-muted">${c.total_lessons}课时</small>
              </div>
            </div>
            <p class="text-muted small mb-2" style="min-height:40px">${escapeHtml(c.description || '')}</p>
            <div class="text-end">
              <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(c)})'>编辑</button>
              <button class="btn btn-sm btn-outline-danger" onclick="del(${c.id})">删除</button>
            </div>
          </div>
        </div>
    `).join('') || '<div class="col-12 text-center text-muted py-4">暂无课程</div>';
}

function openAdd() {
    editing = null;
    document.getElementById('modalTitle').textContent = '新增课程';
    ['name','description'].forEach(k => document.getElementById('i-'+k).value = '');
    document.getElementById('i-level').value = '启蒙级';
    document.getElementById('i-age_range').value = '5-7岁';
    document.getElementById('i-total_lessons').value = 24;
    document.getElementById('i-price').value = 3000;
    document.getElementById('i-status').value = '在售';
    modal().show();
}
function openEdit(c) {
    editing = c.id;
    document.getElementById('modalTitle').textContent = '编辑课程';
    ['name','level','age_range','description','status','total_lessons','price'].forEach(k => document.getElementById('i-'+k).value = c[k]);
    modal().show();
}
async function save() {
    const d = {};
    ['name','level','age_range','description','status','total_lessons','price'].forEach(k => d[k] = document.getElementById('i-'+k).value);
    const r = editing ? await api.put('/api/courses/'+editing, d) : await api.post('/api/courses', d);
    if (r.code === 0) { toast(r.msg,'success'); modal().hide(); loadList(); }
    else toast(r.msg,'danger');
}
async function del(id) {
    if (!confirm('确认删除?')) return;
    const r = await api.del('/api/courses/'+id);
    if (r.code === 0) { toast('删除成功','success'); loadList(); }
}
loadList();
</script>
{% endblock %}
