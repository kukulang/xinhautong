{% extends "base.html" %}
{% block page_title %}排课中心{% endblock %}
{% block content %}
<div class="card-box">
    <div class="toolbar">
        <label class="form-label mb-0">日期范围</label>
        <input id="f-start" type="date" class="form-control" style="width:160px">
        <span>至</span>
        <input id="f-end" type="date" class="form-control" style="width:160px">
        <button class="btn btn-outline-primary" onclick="loadList()"><i class="bi bi-search"></i> 查询</button>
        <div class="ms-auto"><button class="btn btn-primary" onclick="openAdd()"><i class="bi bi-plus-lg"></i> 新增排课</button></div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead><tr>
                <th>日期</th><th>时间</th><th>班级</th><th>教师</th><th>教室</th><th>课程主题</th><th>状态</th><th width="200">操作</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增排课</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-6"><label class="form-label">班级*</label><select id="i-class_id" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label">上课日期*</label><input id="i-lesson_date" type="date" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">开始时间</label><input id="i-start_time" type="time" class="form-control" value="09:00"></div>
      <div class="col-md-3"><label class="form-label">结束时间</label><input id="i-end_time" type="time" class="form-control" value="10:30"></div>
      <div class="col-md-6"><label class="form-label">状态</label>
        <select id="i-status" class="form-select"><option>待上课</option><option>已上课</option><option>已取消</option></select></div>
      <div class="col-12"><label class="form-label">课程主题</label><input id="i-topic" class="form-control" placeholder="如:绕口令训练 / 诗歌朗诵"></div>
      <div class="col-12"><label class="form-label">教学内容</label><textarea id="i-content" class="form-control" rows="3"></textarea></div>
    </div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
      <button class="btn btn-primary" onclick="save()">保存</button></div>
  </div></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
let editing = null;
const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal'));

async function init() {
    const cs = await api.get('/api/classes');
    document.getElementById('i-class_id').innerHTML = cs.data.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    loadList();
}

async function loadList() {
    const s = document.getElementById('f-start').value, e = document.getElementById('f-end').value;
    const r = await api.get(`/api/schedules?start=${s}&end=${e}`);
    document.getElementById('tbody').innerHTML = r.data.map(x => `
        <tr>
            <td>${x.lesson_date}</td>
            <td>${x.start_time}-${x.end_time}</td>
            <td>${escapeHtml(x.class_name)}</td>
            <td>${escapeHtml(x.teacher_name)}</td>
            <td>${escapeHtml(x.classroom)}</td>
            <td>${escapeHtml(x.topic)}</td>
            <td>${statusTag(x.status)}</td>
            <td>
                <a class="btn btn-sm btn-outline-success" href="/attendance?sid=${x.id}">点名</a>
                <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(x)})'>编辑</button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${x.id})">删除</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">暂无数据</td></tr>';
}

function openAdd() {
    editing = null;
    document.getElementById('modalTitle').textContent = '新增排课';
    document.getElementById('i-lesson_date').value = new Date().toISOString().slice(0,10);
    document.getElementById('i-start_time').value = '09:00';
    document.getElementById('i-end_time').value = '10:30';
    document.getElementById('i-topic').value = '';
    document.getElementById('i-content').value = '';
    document.getElementById('i-status').value = '待上课';
    modal().show();
}
function openEdit(x) {
    editing = x.id;
    document.getElementById('modalTitle').textContent = '编辑排课';
    document.getElementById('i-class_id').value = x.class_id;
    document.getElementById('i-lesson_date').value = x.lesson_date;
    document.getElementById('i-start_time').value = x.start_time;
    document.getElementById('i-end_time').value = x.end_time;
    document.getElementById('i-topic').value = x.topic;
    document.getElementById('i-content').value = x.content;
    document.getElementById('i-status').value = x.status;
    modal().show();
}
async function save() {
    const d = {};
    ['class_id','lesson_date','start_time','end_time','topic','content','status'].forEach(k => d[k] = document.getElementById('i-'+k).value);
    const r = editing ? await api.put('/api/schedules/'+editing, d) : await api.post('/api/schedules', d);
    if (r.code === 0) { toast(r.msg,'success'); modal().hide(); loadList(); }
    else toast(r.msg,'danger');
}
async function del(id) {
    if (!confirm('确认删除?')) return;
    const r = await api.del('/api/schedules/'+id);
    if (r.code === 0) { toast('删除成功','success'); loadList(); }
}

init();
</script>
{% endblock %}
