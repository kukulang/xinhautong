{% extends "base.html" %}
{% block page_title %}班级管理{% endblock %}
{% block content %}
<div class="card-box">
    <div class="toolbar">
        <div class="ms-auto"><button class="btn btn-primary" onclick="openAdd()"><i class="bi bi-plus-lg"></i> 新增班级</button></div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead><tr>
                <th>班级名称</th><th>所属课程</th><th>主讲教师</th><th>教室</th>
                <th>开班日期</th><th>容量/已报</th><th>状态</th><th width="220">操作</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<!-- 编辑Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增班级</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-6"><label class="form-label">班级名称*</label><input id="i-name" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">教室</label><input id="i-classroom" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">容量</label><input id="i-capacity" type="number" class="form-control" value="15"></div>
      <div class="col-md-6"><label class="form-label">所属课程*</label><select id="i-course_id" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label">主讲教师</label><select id="i-teacher_id" class="form-select"><option value="">未指定</option></select></div>
      <div class="col-md-4"><label class="form-label">开班日期</label><input id="i-start_date" type="date" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">结班日期</label><input id="i-end_date" type="date" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">状态</label>
        <select id="i-status" class="form-select"><option>开课中</option><option>已结束</option></select></div>
    </div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
      <button class="btn btn-primary" onclick="save()">保存</button></div>
  </div></div>
</div>

<!-- 学员管理Modal -->
<div class="modal fade" id="stuModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">班级学员管理</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="d-flex gap-2 mb-3">
        <select id="stu-select" class="form-select"></select>
        <button class="btn btn-primary" onclick="addStudent()">添加</button>
      </div>
      <table class="table"><thead><tr><th>姓名</th><th>家长电话</th><th>等级</th><th>操作</th></tr></thead>
        <tbody id="stu-tbody"></tbody></table>
    </div>
  </div></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
let editing = null, currentClassId = null, allStudents = [];
const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal'));
const stuModal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('stuModal'));

async function init() {
    const [cs, ts, stus] = await Promise.all([api.get('/api/courses'), api.get('/api/teachers'), api.get('/api/students')]);
    document.getElementById('i-course_id').innerHTML = cs.data.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    document.getElementById('i-teacher_id').innerHTML = '<option value="">未指定</option>' + ts.data.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
    allStudents = stus.data;
    loadList();
}

async function loadList() {
    const res = await api.get('/api/classes');
    document.getElementById('tbody').innerHTML = res.data.map(c => `
        <tr>
            <td><b>${escapeHtml(c.name)}</b></td>
            <td>${escapeHtml(c.course_name)}</td>
            <td>${escapeHtml(c.teacher_name || '未指定')}</td>
            <td>${escapeHtml(c.classroom)}</td>
            <td>${c.start_date}</td>
            <td>${c.student_count}/${c.capacity}</td>
            <td>${statusTag(c.status)}</td>
            <td>
                <button class="btn btn-sm btn-outline-success" onclick="manageStudents(${c.id},'${escapeHtml(c.name)}')">学员</button>
                <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(c)})'>编辑</button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${c.id})">删除</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">暂无数据</td></tr>';
}

function openAdd() {
    editing = null;
    document.getElementById('modalTitle').textContent = '新增班级';
    ['name','classroom'].forEach(k => document.getElementById('i-'+k).value = '');
    document.getElementById('i-capacity').value = 15;
    document.getElementById('i-start_date').value = new Date().toISOString().slice(0,10);
    document.getElementById('i-end_date').value = '';
    document.getElementById('i-status').value = '开课中';
    modal().show();
}
function openEdit(c) {
    editing = c.id;
    document.getElementById('modalTitle').textContent = '编辑班级';
    document.getElementById('i-name').value = c.name;
    document.getElementById('i-classroom').value = c.classroom;
    document.getElementById('i-capacity').value = c.capacity;
    document.getElementById('i-course_id').value = c.course_id;
    document.getElementById('i-teacher_id').value = c.teacher_id || '';
    document.getElementById('i-start_date').value = c.start_date;
    document.getElementById('i-end_date').value = c.end_date;
    document.getElementById('i-status').value = c.status;
    modal().show();
}
async function save() {
    const d = {};
    ['name','classroom','capacity','course_id','teacher_id','start_date','end_date','status'].forEach(k => d[k] = document.getElementById('i-'+k).value);
    const r = editing ? await api.put('/api/classes/'+editing, d) : await api.post('/api/classes', d);
    if (r.code === 0) { toast(r.msg,'success'); modal().hide(); loadList(); }
    else toast(r.msg,'danger');
}
async function del(id) {
    if (!confirm('确认删除?')) return;
    const r = await api.del('/api/classes/'+id);
    if (r.code === 0) { toast('删除成功','success'); loadList(); }
}

async function manageStudents(cid, name) {
    currentClassId = cid;
    document.getElementById('stu-select').innerHTML = allStudents.map(s => `<option value="${s.id}">${s.name} (${s.parent_phone})</option>`).join('');
    await refreshClassStudents();
    stuModal().show();
}
async function refreshClassStudents() {
    const r = await api.get('/api/classes/'+currentClassId+'/students');
    document.getElementById('stu-tbody').innerHTML = r.data.map(s => `
        <tr><td>${s.name}</td><td>${s.parent_phone}</td><td>${s.level}</td>
        <td><button class="btn btn-sm btn-outline-danger" onclick="removeStudent(${s.id})">移除</button></td></tr>
    `).join('') || '<tr><td colspan="4" class="text-center text-muted">暂无学员</td></tr>';
}
async function addStudent() {
    const sid = document.getElementById('stu-select').value;
    const r = await api.post('/api/classes/'+currentClassId+'/students', {student_id: sid});
    if (r.code === 0) { toast('添加成功','success'); refreshClassStudents(); loadList(); }
    else toast(r.msg,'danger');
}
async function removeStudent(sid) {
    if (!confirm('确认移除?')) return;
    const r = await api.del('/api/classes/'+currentClassId+'/students/'+sid);
    if (r.code === 0) { refreshClassStudents(); loadList(); }
}

init();
</script>
{% endblock %}
