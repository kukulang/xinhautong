{% extends "base.html" %}
{% block page_title %}演出活动{% endblock %}
{% block content %}
<div class="card-box">
    <div class="toolbar">
        <div class="ms-auto"><button class="btn btn-primary" onclick="openAdd()"><i class="bi bi-plus-lg"></i> 新增活动</button></div>
    </div>
    <div class="row g-3" id="list"></div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增活动</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-12"><label class="form-label">活动名称*</label><input id="i-title" class="form-control"></div>
      <div class="col-6"><label class="form-label">类型</label>
        <select id="i-category" class="form-select"><option>汇报演出</option><option>比赛</option><option>公益</option></select></div>
      <div class="col-6"><label class="form-label">日期*</label><input id="i-perform_date" type="date" class="form-control"></div>
      <div class="col-12"><label class="form-label">地点</label><input id="i-place" class="form-control"></div>
      <div class="col-12"><label class="form-label">状态</label>
        <select id="i-status" class="form-select"><option>筹备中</option><option>报名中</option><option>已举办</option><option>已取消</option></select></div>
      <div class="col-12"><label class="form-label">描述</label><textarea id="i-description" class="form-control" rows="3"></textarea></div>
    </div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
      <button class="btn btn-primary" onclick="save()">保存</button></div>
  </div></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
let editing = null;
const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal'));

async function loadList() {
    const r = await api.get('/api/performances');
    document.getElementById('list').innerHTML = r.data.map(p => `
        <div class="col-md-6">
          <div class="card-box" style="margin-bottom:0">
            <div class="d-flex justify-content-between">
              <h5>${escapeHtml(p.title)}</h5>
              ${statusTag(p.status)}
            </div>
            <div class="mb-2">
              <span class="tag tag-blue">${p.category}</span>
              <span class="text-muted"><i class="bi bi-calendar"></i> ${p.perform_date}</span>
              <span class="text-muted ms-2"><i class="bi bi-geo-alt"></i> ${escapeHtml(p.place || '待定')}</span>
            </div>
            <p class="text-muted small">${escapeHtml(p.description || '')}</p>
            <div class="text-end">
              <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(p)})'>编辑</button>
              <button class="btn btn-sm btn-outline-danger" onclick="del(${p.id})">删除</button>
            </div>
          </div>
        </div>
    `).join('') || '<div class="col-12 text-center text-muted py-4">暂无活动</div>';
}

function openAdd() {
    editing = null;
    document.getElementById('modalTitle').textContent = '新增活动';
    ['title','place','description'].forEach(k => document.getElementById('i-'+k).value = '');
    document.getElementById('i-category').value = '汇报演出';
    document.getElementById('i-perform_date').value = new Date().toISOString().slice(0,10);
    document.getElementById('i-status').value = '筹备中';
    modal().show();
}
function openEdit(p) {
    editing = p.id;
    document.getElementById('modalTitle').textContent = '编辑活动';
    ['title','category','perform_date','place','description','status'].forEach(k => document.getElementById('i-'+k).value = p[k]);
    modal().show();
}
async function save() {
    const d = {};
    ['title','category','perform_date','place','description','status'].forEach(k => d[k] = document.getElementById('i-'+k).value);
    const r = editing ? await api.put('/api/performances/'+editing, d) : await api.post('/api/performances', d);
    if (r.code === 0) { toast(r.msg,'success'); modal().hide(); loadList(); }
    else toast(r.msg,'danger');
}
async function del(id) {
    if (!confirm('确认删除?')) return;
    const r = await api.del('/api/performances/'+id);
    if (r.code === 0) { toast('删除成功','success'); loadList(); }
}
loadList();
</script>
{% endblock %}
