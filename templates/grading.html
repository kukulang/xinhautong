{% extends "base.html" %}
{% block page_title %}考级证书{% endblock %}
{% block content %}
<div class="card-box">
    <div class="toolbar">
        <div class="ms-auto"><button class="btn btn-primary" onclick="openAdd()"><i class="bi bi-plus-lg"></i> 报考记录</button></div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead><tr>
                <th>学员</th><th>报考等级</th><th>考试日期</th><th>考点</th>
                <th>分数</th><th>结果</th><th>证书编号</th><th width="160">操作</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增报考</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-12"><label class="form-label">学员*</label><select id="i-student_id" class="form-select"></select></div>
      <div class="col-6"><label class="form-label">报考等级*</label>
        <select id="i-level" class="form-select"><option>启蒙级</option><option>初级</option><option>中级</option><option>高级</option><option>金牌级</option></select></div>
      <div class="col-6"><label class="form-label">考试日期</label><input id="i-exam_date" type="date" class="form-control"></div>
      <div class="col-12"><label class="form-label">考点</label><input id="i-exam_place" class="form-control"></div>
      <div class="col-6"><label class="form-label">分数</label><input id="i-score" type="number" class="form-control" value="0"></div>
      <div class="col-6"><label class="form-label">结果</label>
        <select id="i-result" class="form-select"><option>待考试</option><option>通过</option><option>未通过</option></select></div>
      <div class="col-12"><label class="form-label">证书编号</label><input id="i-certificate_no" class="form-control"></div>
      <div class="col-12"><label class="form-label">备注</label><input id="i-remark" class="form-control"></div>
    </div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
      <button class="btn btn-primary" onclick="save()">保存</button></div>
  </div></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
let editing = null;
const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal'));

async function init() {
    const stus = await api.get('/api/students');
    document.getElementById('i-student_id').innerHTML = stus.data.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    loadList();
}

async function loadList() {
    const r = await api.get('/api/exams');
    document.getElementById('tbody').innerHTML = r.data.map(e => `
        <tr>
            <td><b>${escapeHtml(e.student_name)}</b></td>
            <td><span class="tag tag-pink">${e.level}</span></td>
            <td>${e.exam_date}</td>
            <td>${escapeHtml(e.exam_place)}</td>
            <td>${e.score}</td>
            <td>${statusTag(e.result)}</td>
            <td>${escapeHtml(e.certificate_no || '-')}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(e)})'>编辑</button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${e.id})">删除</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">暂无记录</td></tr>';
}

function openAdd() {
    editing = null;
    document.getElementById('modalTitle').textContent = '新增报考';
    document.getElementById('i-exam_date').value = new Date().toISOString().slice(0,10);
    ['exam_place','certificate_no','remark'].forEach(k => document.getElementById('i-'+k).value = '');
    document.getElementById('i-score').value = 0;
    document.getElementById('i-level').value = '初级';
    document.getElementById('i-result').value = '待考试';
    modal().show();
}
function openEdit(e) {
    editing = e.id;
    document.getElementById('modalTitle').textContent = '编辑报考';
    ['student_id','level','exam_date','exam_place','score','result','certificate_no','remark'].forEach(k => document.getElementById('i-'+k).value = e[k]);
    modal().show();
}
async function save() {
    const d = {};
    ['student_id','level','exam_date','exam_place','score','result','certificate_no','remark'].forEach(k => d[k] = document.getElementById('i-'+k).value);
    const r = editing ? await api.put('/api/exams/'+editing, d) : await api.post('/api/exams', d);
    if (r.code === 0) { toast(r.msg,'success'); modal().hide(); loadList(); }
    else toast(r.msg,'danger');
}
async function del(id) {
    if (!confirm('确认删除?')) return;
    const r = await api.del('/api/exams/'+id);
    if (r.code === 0) { toast('删除成功','success'); loadList(); }
}
init();
</script>
{% endblock %}
